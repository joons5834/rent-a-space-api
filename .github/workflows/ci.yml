name: CI
on:
  push: { branches: [ main ] }
  pull_request:
permissions:
  contents: read
jobs:
  build:
    # Pin the image: ubuntu-latest is migrating to Ubuntu 26.04 during
    # Oct-Nov 2026 and GitHub emits a warning annotation for it.
    # See actions/runner-images#14748. Bump deliberately after testing.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Docker is available (Testcontainers)
        run: docker info
      - run: ./gradlew build
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
