services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rent_a_space
      POSTGRES_USER: rent
      POSTGRES_PASSWORD: rent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent -d rent_a_space"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
