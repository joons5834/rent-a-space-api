# PostgreSQL is supplied by Testcontainers:
# src/test/java/rent_a_space_api_clone/PostgresTestSupport.java
#
# Hibernate generates the schema for these tests. The production DDL
# (src/main/resources/rent-a-space.sql) is verified separately by
# rent_a_space_api_clone.schema.ProductionSchemaContractTest.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
logging:
  level:
    org.springframework.security: DEBUG
